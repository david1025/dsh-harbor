name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --- Publish both architectures (cross-compiled on the x64 runner) ---
      - name: Publish win-x64
        run: dotnet publish ./DSHHarbor/DSHHarbor.csproj -c Release -r win-x64 --self-contained false -o ./artifacts/win-x64

      - name: Publish win-arm64
        run: dotnet publish ./DSHHarbor/DSHHarbor.csproj -c Release -r win-arm64 --self-contained false -o ./artifacts/win-arm64

      # --- Build installers with the bundled Inno Setup compiler ---
      - name: Build x64 installer
        run: ./tools/InnoSetup/ISCC.exe ./installer/DSHHarbor.iss

      - name: Build arm64 installer
        run: ./tools/InnoSetup/ISCC.exe ./installer/DSHHarbor.arm64.iss

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: artifacts/installer/*.exe
          if-no-files-found: error
